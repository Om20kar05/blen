services:
  - type: web
    name: blen-hr-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: node build.js
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
